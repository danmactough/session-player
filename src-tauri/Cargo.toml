[workspace]
members = ["core"]

[package]
name = "session-player"
version = "0.1.0"
description = "A unified viewer for coding-agent sessions"
authors = ["Dan MacTough"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "session_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
notify-debouncer-mini = "0.7"
dirs = "6"
anyhow = "1"
base64 = "0.22"
session-player-core = { path = "core" }
