[workspace]
members = ["core", "cli", "server", "client"]

# The sp command ships with the app and reports the app's version. `npm version`
# rewrites every line here that starts with "version".
[workspace.package]
version = "0.16.0"

[package]
name = "session-player"
version = "0.16.0"
description = "A unified viewer for coding-agent sessions"
authors = ["Dan MacTough"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "session_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
dirs = "6"
session-player-core = { path = "core" }
session-player-client = { path = "client" }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[dev-dependencies]
base64 = "0.22"
session-player-server = { path = "server" }
