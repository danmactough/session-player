[package]
name = "session-player-client"
version.workspace = true
description = "Client for the Session Player server: pinned TLS, pairing, operation calls and the event stream"
authors = ["Dan MacTough"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[dependencies]
session-player-core = { path = "../core" }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = { version = "0.1", features = ["channel"] }
# default-features = false with ring everywhere, so aws-lc-sys never enters the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
