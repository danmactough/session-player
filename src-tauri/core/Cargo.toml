[package]
name = "session-player-core"
version = "0.1.0"
description = "Transcript parsing, indexing, note generation and bundle export for session-player"
authors = ["Dan MacTough"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# Deliberately free of Tauri. The integration tests only exercise this crate, so keeping the
# GUI stack out of its dependency graph is what makes `cargo test` cheap.

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1.10"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
anyhow = "1"
base64 = "0.22"
zstd = "0.13"
