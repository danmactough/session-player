[package]
name = "session-player-server"
version.workspace = true
description = "The persistent Session Player server: one HTTP API over the operations in session-player-core"
authors = ["Dan MacTough"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[dependencies]
session-player-core = { path = "../core" }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
http-body-util = "0.1"
# default-features = false with ring everywhere, so aws-lc-sys never enters the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"

[dev-dependencies]
session-player-client = { path = "../client" }
